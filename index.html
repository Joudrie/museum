<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1d1714" />
    <title>Curation</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="game"></div>

    <div id="hud">
      <span class="museum-name">Your Museum</span>
    </div>

    <button id="home-btn" class="pixel-btn" aria-label="Customize">
      <svg viewBox="0 0 11 10" width="22" height="20" shape-rendering="crispEdges" aria-hidden="true">
        <g fill="currentColor"><rect x="5" y="0" width="1" height="1" /><rect x="4" y="1" width="3" height="1" /><rect x="3" y="2" width="5" height="1" /><rect x="2" y="3" width="7" height="1" /><rect x="1" y="4" width="9" height="1" /><rect x="0" y="5" width="11" height="1" /><rect x="2" y="6" width="7" height="1" /><rect x="2" y="7" width="3" height="3" /><rect x="6" y="7" width="3" height="3" /></g>
      </svg>
    </button>

    <button id="interact" class="pixel-btn hidden"><span class="bang"></span>Interact</button>

    <div id="decor" class="hidden" role="dialog" aria-label="Customize">
      <div class="decor-sheet">
        <div class="decor-head">
          <h2>Customize</h2>
          <button class="decor-close pixel-btn" aria-label="Close">✕</button>
        </div>
        <div class="decor-tabs">
          <button data-tab="room" class="on">This room</button>
          <button data-tab="character">Character</button>
        </div>
        <div class="decor-body"></div>
        <button class="decor-reset">Reset mess &amp; rooms (testing)</button>
      </div>
    </div>

    <div id="talk" class="hidden">
      <svg class="talk-shape" aria-hidden="true"><path class="talk-shadow" /><path class="talk-body" /></svg>
      <div class="talk-box">
        <div class="talk-who"></div>
        <p class="talk-text"></p>
      </div>
    </div>

    <div id="build" class="hidden" role="dialog" aria-label="Build a room">
      <div class="build-sheet">
        <div class="decor-head">
          <h2>New room</h2>
          <button class="build-cancel pixel-btn" aria-label="Cancel">✕</button>
        </div>
        <div class="build-row">
          <button data-orient="vertical">Vertical</button>
          <button data-orient="horizontal">Horizontal</button>
        </div>
        <div class="build-row">
          <button data-size="short">Short</button>
          <button data-size="medium">Medium</button>
          <button data-size="long">Long</button>
        </div>
        <p class="build-capacity"></p>
        <div class="build-preview">
          <canvas class="build-body"></canvas>
          <div class="build-end-wrap">
            <div class="build-end"></div>
            <div class="build-cut"></div>
          </div>
          <div class="build-dots"></div>
        </div>
        <p class="build-caption"></p>
        <p class="build-hint">Swipe the end up or down to choose how the room ends</p>
        <button class="build-buy pixel-btn">Build room · free while testing</button>
      </div>
    </div>

    <div id="slotmenu" class="hidden" role="dialog" aria-label="Wall spot">
      <div class="decor-sheet">
        <div class="decor-head">
          <h2>Wall spot</h2>
          <button class="slot-close pixel-btn" aria-label="Close">✕</button>
        </div>
        <div class="choices slot-kinds">
          <button data-kind="painting">Painting</button>
          <button data-kind="plain">Plain wall</button>
          <button data-kind="door">Door</button>
        </div>
        <div class="slot-paintings"></div>
      </div>
    </div>

    <div id="stick"><div class="knob"></div></div>

    <div id="rotate">Turn your phone upright to keep curating.</div>

    <div id="viewer" class="hidden" aria-hidden="true">
      <button class="viewer-close" aria-label="Close">✕</button>
      <div class="viewer-scroll">
        <div class="wall-track"></div>
        <div class="viewer-dots"></div>
        <div class="viewer-info">
          <h2 class="info-title"></h2>
          <p class="info-meta"></p>
          <p class="info-blurb"></p>
          <div class="info-rating" role="radiogroup" aria-label="Your rating"></div>
          <textarea class="info-note" rows="3" placeholder="Your journal note…"></textarea>
          <button class="viewer-change">Change this wall spot</button>
        </div>
      </div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
