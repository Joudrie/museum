<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Island Tiles</title>
    <style>
      :root { --bg: #1d1714; --panel: #2a211d; --ink: #f4ead6; --muted: #b9a98f; --gold: #c9a23f; --line: #5b4216; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink); font-family: Georgia, serif; }
      header { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px; background: rgba(29, 23, 20, 0.95); border-bottom: 2px solid var(--line); }
      header h1 { margin: 0 auto 0 0; font-size: 18px; font-weight: normal; }
      button { min-height: 40px; padding: 6px 12px; border: 2px solid var(--line); border-radius: 8px; background: rgba(255, 255, 255, 0.05); color: var(--ink); font: inherit; font-size: 14px; }
      button.on { border-color: var(--gold); background: rgba(201, 162, 63, 0.18); }
      main { padding: 0 16px 40px; max-width: 1100px; margin: 0 auto; }
      h2 { margin: 26px 0 4px; font-size: 15px; font-weight: normal; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }
      .note { margin: 0 0 10px; color: var(--muted); font-size: 13px; }
      .grid { display: flex; flex-wrap: wrap; gap: 10px; }
      .card { display: grid; justify-items: center; gap: 4px; padding: 8px; background: var(--panel); border: 2px solid var(--line); border-radius: 8px; }
      .card canvas { image-rendering: pixelated; background: repeating-conic-gradient(#3a302a 0 25%, #2e2622 0 50%) 0 0 / 16px 16px; }
      .card b { font-size: 12px; font-weight: normal; }
      .card code { font-size: 11px; color: var(--gold); }
      .card small { font-size: 10px; color: var(--muted); }
      #demo { display: block; width: 100%; max-width: 640px; image-rendering: pixelated; border: 2px solid var(--line); border-radius: 8px; }
    </style>
  </head>
  <body>
    <header>
      <h1>Island tiles · dev</h1>
      <button id="anim" class="on">Animate</button>
      <button id="zoom">Zoom 2×</button>
      <button id="png">Download sheet (PNG + JSON)</button>
    </header>
    <main>
      <h2>Sample island</h2>
      <p class="note">Built only from the tiles below, to show how they fit together.</p>
      <canvas id="demo"></canvas>
      <div id="groups"></div>
    </main>
    <script type="module" src="./src/tilesheet.js"></script>
  </body>
</html>
