<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Art Library</title>
    <style>
      :root { --bg: #1d1714; --panel: #2a211d; --ink: #f4ead6; --muted: #b9a98f; --gold: #c9a23f; --line: #5b4216; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink); font-family: Georgia, serif; }
      header { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px; background: rgba(29, 23, 20, 0.96); border-bottom: 2px solid var(--line); }
      header h1 { margin: 0 auto 0 0; font-size: 18px; font-weight: normal; }
      header a, header button { min-height: 40px; padding: 8px 12px; border: 2px solid var(--line); border-radius: 8px; background: rgba(255, 255, 255, 0.05); color: var(--ink); font: inherit; font-size: 14px; text-decoration: none; }
      header button.on { border-color: var(--gold); background: rgba(201, 162, 63, 0.18); }
      main { padding: 0 16px 40px; max-width: 1100px; margin: 0 auto; }
      h2 { margin: 26px 0 8px; font-size: 15px; font-weight: normal; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }
      .grid { display: flex; flex-wrap: wrap; gap: 10px; }
      .card { display: grid; justify-items: center; gap: 4px; padding: 8px; background: var(--panel); border: 2px solid var(--line); border-radius: 8px; min-width: 86px; }
      .card .row { display: flex; gap: 2px; }
      .card canvas { image-rendering: pixelated; background: repeating-conic-gradient(#3a302a 0 25%, #2e2622 0 50%) 0 0 / 16px 16px; }
      .card b { font-size: 12px; font-weight: normal; text-align: center; max-width: 160px; }
      .card code { font-size: 11px; color: var(--gold); }
    </style>
  </head>
  <body>
    <header>
      <h1>Art library · dev</h1>
      <button data-tab="characters" class="on">Characters</button>
      <button data-tab="famous">Famous</button>
      <button data-tab="pets">Pets</button>
      <button data-tab="decor">Decor</button>
      <button data-tab="creatures">Creatures</button>
      <a href="./tiles.html">Island tiles →</a>
    </header>
    <main id="lib"></main>
    <script type="module" src="./src/library.js"></script>
  </body>
</html>
